<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>여행 · Домашнее задание</title>
<link href="https://fonts.googleapis.com/css2?family=Sunflower:wght@500;700&family=Yeon+Sung&display=swap" rel="stylesheet">
<style>
:root{--sky1:#b9e8ff;--sky2:#e3f6ff;--sand:#f9e6b8;--card:#fffdf6;--ink:#0f4a5c;--mut:#4f7f8c;--shd:#e6bf6a;--c0:#9adcff;--c1:#a8e8be;--c2:#ffe08a;--c3:#8fe6df;--okbg:#b5efc9;--nobg:#ffc4b8;--sun:#ffb21f;--sec:var(--c0);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sky1:#0d2b44;--sky2:#14405a;--sand:#3a3a2c;--card:#17384d;--ink:#eaf7ff;--mut:#9cc4d4;--shd:#5a4a24;--c0:#1f5f8a;--c1:#1f6b4a;--c2:#7a6420;--c3:#1d6b6b;--okbg:#1f7a52;--nobg:#8a3d34;--sun:#ffc552;color-scheme:dark}}
:root[data-theme="dark"]{--sky1:#0d2b44;--sky2:#14405a;--sand:#3a3a2c;--card:#17384d;--ink:#eaf7ff;--mut:#9cc4d4;--shd:#5a4a24;--c0:#1f5f8a;--c1:#1f6b4a;--c2:#7a6420;--c3:#1d6b6b;--okbg:#1f7a52;--nobg:#8a3d34;--sun:#ffc552;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 55%,var(--sand) 100%) fixed;color:var(--ink);font-family:"Sunflower","Noto Sans KR",system-ui,sans-serif;font-weight:500;font-size:19px;line-height:1.45;min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 40px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.logo{background:var(--sun);color:#3b2a00;border:3px solid var(--ink);border-radius:20px;box-shadow:4px 4px 0 var(--shd);padding:2px 16px;font:400 32px "Yeon Sung","Sunflower",sans-serif;transform:rotate(-3deg);flex:none}
.top small{display:block;color:var(--mut);font-size:15px}
.top .st{font-size:26px;letter-spacing:4px}
.track{position:relative;height:16px;background:var(--card);border:3px solid var(--ink);border-radius:12px;margin:28px 4px 22px}
.track i{display:block;height:100%;width:0;background:repeating-linear-gradient(135deg,var(--sec) 0 10px,var(--card) 10px 14px);border-radius:8px;transition:width .6s cubic-bezier(.3,1.4,.5,1)}
.track b{position:absolute;top:-28px;left:0;font-size:28px;transition:left .6s cubic-bezier(.3,1.4,.5,1);transform:translateX(-50%)}
.card{position:relative;background:var(--card);border:3px solid var(--ink);border-radius:24px;box-shadow:6px 6px 0 var(--shd);padding:26px 18px 20px}
.tag{display:inline-block;background:var(--sec);border:3px dashed var(--ink);border-radius:12px;padding:2px 14px;font-size:16px;font-weight:700;margin:-42px 0 14px;transform:rotate(-2deg)}
.cnt{position:absolute;right:14px;top:-16px;background:var(--card);border:3px solid var(--ink);border-radius:999px;padding:0 12px;font-size:15px}
.ru{color:var(--mut);font-size:16px;margin:0 0 6px}
.sent{font-size:27px;line-height:1.55;font-weight:700;margin:0 0 20px;word-break:keep-all}
.blank{display:inline-block;min-width:54px;border-bottom:4px dotted var(--sun);text-align:center;margin:0 2px}
.opts{display:grid;gap:12px}
.btn{font:inherit;font-weight:700;font-size:21px;min-height:60px;width:100%;padding:10px 16px;border-radius:16px;border:3px solid var(--ink);background:var(--card);color:var(--ink);cursor:pointer;box-shadow:0 5px 0 var(--shd);transition:transform .1s,box-shadow .1s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--shd)}
.btn:focus-visible,.inp:focus-visible,.chip:focus-visible{outline:4px solid var(--sun);outline-offset:2px}
.btn.main{background:var(--sec);margin-top:16px}
.btn.ghost{background:var(--c3);margin-top:14px;font-size:18px;min-height:54px}
.btn.ok,.chip.ok,.inp.ok{background:var(--okbg)}
.btn.no,.chip.no,.inp.no{background:var(--nobg)}
.btn:disabled,.chip:disabled{cursor:default;transform:none}
.inp{width:100%;min-height:60px;font:inherit;font-weight:700;font-size:24px;padding:8px 16px;border-radius:16px;border:3px solid var(--ink);background:var(--card);color:var(--ink)}
.hint{display:inline-block;font-size:15px;background:var(--c2);border:2px solid var(--ink);border-radius:10px;padding:1px 10px;margin:0 0 12px}
.chips{display:flex;flex-wrap:wrap;gap:12px}
.chip{font:inherit;font-weight:700;font-size:23px;min-height:58px;padding:6px 18px;border-radius:16px;border:3px solid var(--ink);background:var(--card);color:var(--ink);cursor:pointer;box-shadow:0 5px 0 var(--shd)}
.fb{margin-top:18px;padding:14px 16px;border-radius:16px;border:3px dashed var(--ink);animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
.fb.ok{background:var(--okbg)}.fb.no{background:var(--nobg)}
.fb b{font-size:20px}
.fb p{margin:6px 0 0;font-size:16px}
.stamp{position:absolute;right:10px;top:-28px;font-size:46px;animation:stamp .7s cubic-bezier(.3,1.8,.5,1) forwards;pointer-events:none}
.sticker{position:absolute;font-size:36px;pointer-events:none}
.shake{animation:shake .4s}
.bounce{animation:bounce .6s}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:none;opacity:1}}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@keyframes bounce{30%{transform:scale(1.03) rotate(-1deg)}60%{transform:scale(.99) rotate(1deg)}}
@keyframes stamp{0%{transform:scale(3) rotate(-30deg);opacity:0}100%{transform:scale(1) rotate(-12deg);opacity:1}}
.petal{position:fixed;top:-40px;font-size:28px;pointer-events:none;z-index:9;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translate(var(--dx),108vh) rotate(var(--r));opacity:.3}}
.big{font:400 84px/1 "Yeon Sung","Sunflower",sans-serif;color:var(--sun);text-shadow:3px 3px 0 var(--ink);text-align:center;margin:8px 0}
.center{text-align:center}
.row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:2px dotted var(--ink);font-size:18px}
textarea{width:100%;height:120px;margin-top:12px;border:3px solid var(--ink);border-radius:14px;background:var(--card);color:var(--ink);font:13px/1.4 ui-monospace,monospace;padding:10px}
a.btn{display:block;text-align:center;text-decoration:none;line-height:36px}
.shore{text-align:center;font-size:28px;letter-spacing:8px;margin-top:34px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div class="logo">여행</div><div><span class="st">☀️🌴🌊</span><small>Путешествия · Домашнее задание</small></div></div>
  <div id="app"></div>
  <div class="shore">⛱️🌴🐚🌊</div>
</div>
<script>
const TO="akosenko62@gmail.com";
/* c: [верный, предложение, неверные[], пояснение]; t: [до, после, перевод, подсказка, ответы[], пояснение]; e: [части, номер ошибки, исправление, перевод, пояснение] */
const S=[
{t:"Часть 1 · Выбери слово",ic:"🧳",k:"c",q:[
["여권","해외여행에 꼭 필요해서 ___을 만들었어요.",["섬","축제","야경"],"여권을 만들다 — делать загранпаспорт."],
["예약했어요","여행 가기 전에 호텔을 ___.",["도착했어요","떠났어요","올라갔어요"],"호텔을 예약하다 — бронировать отель."],
["싸요","내일 출발해서 오늘 짐을 ___.",["바꿔요","찾아봐요","구경해요"],"짐을 싸다 — собирать вещи."],
["바꿔요","공항에서 돈을 ___.",["싸요","예매해요","만들어요"],"돈을 바꾸다 — обменивать деньги."],
["경치","산 위에서 ___가 정말 멋있어요.",["온천","박물관","축제"],"경치 — виды, пейзажи."],
["온천","추운 날에는 ___에서 쉬어요.",["야구장","미술관","섬"],"온천 — горячий источник."],
["박물관","옛날 물건과 전통을 보러 ___에 가요.",["바다","온천","야구장"],"박물관 — музей."],
["서핑해요","바다에서 파도를 타고 ___.",["올라가요","떠나요","도착해요"],"서핑하다 — заниматься серфингом."]]},
{t:"Часть 2 · Подставь грамматику",ic:"☀️",k:"c",q:[
["있으면","휴가가 ___ 바다에 가요.",["있면","있으려면","있는"],"A/V-(으)면 — «если». 있다 с патчимом → 으면."],
["도착하면","호텔에 ___ 전화하세요.",["도착하으면","도착하는","도착하고"],"하다 без патчима → 하면: 도착하면."],
["멀면","집에서 공항이 ___ 택시를 타세요.",["멀으면","먼","머면"],"Патчим ㄹ + 면 (без 으): 멀면."],
["가는","제가 내일 ___ 곳은 제주도예요.",["갈은","가은","가고"],"V-는 N — глагол перед существительным: 가는 곳."],
["사는","제가 ___ 곳은 바다 근처예요.",["살는","산을","사은"],"ㄹ 탈락: 살다 → 사는 곳."],
["보는","야구 경기를 ___ 사람이 많아요.",["본는","보은","볼는"],"보다 → 보는 사람."],
["가고 싶어요","저는 신혼여행으로 섬에 ___.",["가고 싶어 해요","가면 싶어요","가는 싶어요"],"1-е лицо (я, ты) → V-고 싶다."],
["가고 싶어 해요","제 친구는 온천에 ___.",["가고 싶어요","가면 싶어요","가는 싶어요"],"3-е лицо (он, она, друг) → V-고 싶어 하다."]]},
{t:"Часть 3 · Допиши предложение",ic:"🏖️",k:"t",q:[
["날씨가","바다에서 서핑해요.","Если погода хорошая, занимаюсь серфингом на море.","좋다 + A/V-(으)면",["좋으면"],"좋다 (патчим) → 좋으면."],
["휴가가","어디에 가고 싶어요?","Если будет отпуск, куда вы хотите поехать?","있다 + A/V-(으)면",["있으면"],"있다 → 있으면."],
["공항에","전화하세요.","Когда приедете в аэропорт, позвоните.","도착하다 + A/V-(으)면",["도착하면"],"도착하다 → 도착하면."],
["저는 바다에서 서핑을","","Я хочу заниматься серфингом на море.","하다 + V-고 싶다",["하고 싶어요"],"하다 → 하고 싶어요."],
["제 친구는 온천에","","Мой друг хочет поехать на горячий источник.","가다 + V-고 싶어 하다",["가고 싶어 해요","가고 싶어해요","가고 싶어 합니다"],"3-е лицо → 싶어 하다."],
["제가 지금","곳은 부산이에요.","Место, где я сейчас живу, — Пусан.","살다 + V-는 N",["사는"],"ㄹ 탈락: 살다 → 사는."],
["이곳은 야구 경기를","곳이에요.","Это место, где смотрят бейсбольный матч.","보다 + V-는 N",["보는"],"보다 → 보는."]]},
{t:"Часть 4 · Найди ошибку",ic:"🔍",k:"e",q:[
[["휴가가","있면","여행하고 싶어요."],1,"있으면","Если будет отпуск, хочу путешествовать.","있다 с патчимом → 으면."],
[["집에서","멀으면","택시를","타세요."],1,"멀면","Если далеко от дома, езжайте на такси.","Патчим ㄹ → 면, без 으."],
[["제가","살는","곳은","바다 근처예요."],1,"사는","Место, где я живу, у моря.","ㄹ 탈락: 살다 → 사는."],
[["제 친구는","온천에","가고 싶어요."],2,"가고 싶어 해요","Мой друг хочет поехать на горячий источник.","Подлежащее в 3-м лице → 싶어 하다."],
[["저는","섬에","가고 싶어 해요."],2,"가고 싶어요","Я хочу поехать на остров.","1-е лицо → 싶다."],
[["야구 경기를","본는","곳이에요."],1,"보는","Это место, где смотрят бейсбольный матч.","보다 → 보는."]]}
];
const $=s=>document.querySelector(s);
const total=S.reduce((a,x)=>a+x.q.length,0);
const BG=["--c0","--c1","--c2","--c3"];
let si,qi,done,sc,log,name;
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const norm=s=>s.replace(/[\s.!?,~]/g,"");
const app=$("#app");
const setSec=i=>document.documentElement.style.setProperty("--sec","var("+BG[i%4]+")");
function sticker(c,em,css){const s=el("span","sticker",em);s.style.cssText=css;c.append(s)}

function start(){
  si=0;qi=0;done=0;sc=S.map(()=>0);log=[];setSec(0);
  app.innerHTML="";
  const c=el("div","card");
  c.append(el("p","sent","안녕하세요! ☀️"));
  const i=el("input","inp");i.placeholder="Имя и фамилия";i.autocomplete="name";
  try{i.value=localStorage.getItem("hw_name")||""}catch(e){}
  const b=el("button","btn main","출발! · Начать");
  b.onclick=()=>{name=i.value.trim();if(!name){i.focus();i.classList.add("shake");setTimeout(()=>i.classList.remove("shake"),400);return}
    try{localStorage.setItem("hw_name",name)}catch(e){}
    render()};
  c.append(i,b);
  sticker(c,"🌴","right:-6px;top:-30px;transform:rotate(10deg)");
  sticker(c,"🐚","left:-8px;bottom:-18px;transform:rotate(-15deg)");
  app.append(c);
}

function render(){
  const sec=S[si],q=sec.q[qi];setSec(si);
  app.innerHTML="";
  const tr=el("div","track");const bi=el("i");const mk=el("b","","⛵");tr.append(bi,mk);app.append(tr);
  const setP=()=>{const p=done/total*100;bi.style.width=p+"%";mk.style.left=p+"%"};
  setP();
  const c=el("div","card");
  c.append(el("span","cnt",(qi+1)+" / "+sec.q.length));
  c.append(el("span","tag",sec.ic+" "+sec.t));
  const fb=el("div");
  const rec=(ok,user,right,expl)=>{
    done++;setP();
    if(ok){sc[si]++;petals();c.classList.add("bounce");c.append(el("span","stamp","🌺"))}else{c.classList.add("shake")}
    log.push((si+1)+"."+(qi+1)+" "+(ok?"✓":"✗")+" "+user+(ok?"":" → "+right));
    fb.className="fb "+(ok?"ok":"no");fb.innerHTML="";
    fb.append(el("b","",ok?"정답! Верно!":"Правильно: "+right));
    if(expl)fb.append(el("p","",expl));
    const n=el("button","btn main",(si===S.length-1&&qi===sec.q.length-1)?"Результат 🎉":"다음 · Дальше");
    n.onclick=next;fb.append(n);n.focus({preventScroll:true});
  };
  if(sec.k==="c"){
    const [ans,s,wr,ex]=q;
    const p=el("p","sent");p.innerHTML=s.replace(/___/g,'<span class="blank">&nbsp;&nbsp;?&nbsp;&nbsp;</span>');c.append(p);
    const o=el("div","opts");
    shuffle([ans,...wr]).forEach(w=>{const b=el("button","btn",w);
      b.onclick=()=>{o.querySelectorAll("button").forEach(x=>{x.disabled=true;if(x.textContent===ans)x.classList.add("ok")});
        if(w!==ans)b.classList.add("no");
        rec(w===ans,w,ans,ex)};o.append(b)});
    c.append(o);
  }else if(sec.k==="t"){
    const [pre,post,ru,hint,ans,ex]=q;
    c.append(el("p","ru",ru),el("p","hint",hint));
    c.append(el("p","sent",pre+" ＿＿＿ "+post));
    const i=el("input","inp");i.placeholder="한국어로…";i.lang="ko";i.autocomplete="off";i.autocapitalize="off";i.spellcheck=false;
    const b=el("button","btn main","확인 · Проверить");
    const go=()=>{const v=norm(i.value);if(!v){i.focus();return}
      i.disabled=true;b.remove();
      const ok=ans.some(a=>norm(a)===v||norm(pre+a+post)===v);
      i.classList.add(ok?"ok":"no");
      rec(ok,i.value.trim(),ans[0],ex)};
    b.onclick=go;i.onkeydown=e=>{if(e.key==="Enter")go()};
    c.append(i,b);
  }else{
    const [parts,w,fix,ru,ex]=q;
    c.append(el("p","ru",ru));
    const ch=el("div","chips");
    parts.forEach((t,idx)=>{const b=el("button","chip",t);
      b.onclick=()=>{ch.querySelectorAll("button").forEach(x=>x.disabled=true);
        ch.children[w].classList.add("ok");if(idx!==w)b.classList.add("no");
        rec(idx===w,t,fix,"Исправление: "+parts[w]+" → "+fix+". "+ex)};
      ch.append(b)});
    c.append(ch);
  }
  c.append(fb);
  sticker(c,["🧳","☀️","🏖️","🔍"][si],"right:-8px;bottom:-22px;transform:rotate(14deg)");
  app.append(c);
}

function next(){qi++;if(qi>=S[si].q.length){si++;qi=0}
  if(si>=S.length)result();else{render();window.scrollTo({top:0,behavior:"smooth"})}}

function petals(){
  const E=["☀️","🌴","🐚","🌊","🍹","⭐"];
  for(let k=0;k<16;k++){const p=el("span","petal",E[k%E.length]);
    p.style.left=(Math.random()*100)+"vw";
    p.style.setProperty("--dx",((Math.random()-.5)*180)+"px");
    p.style.setProperty("--r",(Math.random()*360)+"deg");
    p.style.animationDelay=(Math.random()*.4)+"s";
    document.body.append(p);setTimeout(()=>p.remove(),2400)}
}

function result(){
  const sum=sc.reduce((a,b)=>a+b,0),pct=Math.round(sum/total*100);
  app.innerHTML="";setSec(2);
  const tr=el("div","track");const bi=el("i");bi.style.width="100%";const mk=el("b","","⛵");mk.style.left="100%";tr.append(bi,mk);app.append(tr);
  const c=el("div","card");
  c.append(el("p","ru center","Результат: "+name));
  c.append(el("div","big",pct+"%"));
  c.append(el("p","center",sum+" из "+total+" — "+(pct>=90?"대단해요! Отлично! 🏆":pct>=70?"잘했어요! Хорошая работа! 🌟":pct>=50?"좋아요! Неплохо, повтори слабые места.":"화이팅! Повтори тему и попробуй снова. 💪")));
  S.forEach((s,i)=>{const r=el("div","row");r.append(el("span","",s.ic+" "+s.t.split(" · ")[0]),el("b","",sc[i]+" / "+s.q.length));c.append(r)});
  const date=new Date().toLocaleString("ru-RU");
  const text="여행 — домашнее задание\nУченик: "+name+"\nДата: "+date+"\nИтого: "+sum+"/"+total+" ("+pct+"%)\n"+S.map((s,i)=>s.t.split(" · ")[0]+": "+sc[i]+"/"+s.q.length).join("; ")+"\n\nОтветы (✗ — ответ ученика → верный):\n"+log.join("\n");
  const a=el("a","btn main","📧 Отправить учителю");
  a.href="mailto:"+TO+"?subject="+encodeURIComponent("여행 ДЗ: "+name+" — "+sum+"/"+total)+"&body="+encodeURIComponent(text);
  a.target="_blank";a.rel="noopener";
  const ta=el("textarea");ta.value=text;ta.readOnly=true;
  const cp=el("button","btn ghost","Скопировать результат");
  cp.onclick=async()=>{try{await navigator.clipboard.writeText(text)}catch(e){ta.select();try{document.execCommand("copy")}catch(_){}}
    cp.textContent="Скопировано ✓"};
