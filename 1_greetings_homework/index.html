<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HELLO · 1과 Домашнее задание</title>
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#dfe9f5;--grid:rgba(60,100,170,.13);--card:#fff;--ink:#1d2333;--mut:#5d6a85;--pen:#1b3fa0;--line:#cfd8e8;--okbg:#c9f2dc;--nobg:#ffd0d0;--yel:#ffc233;--band:#e63946;--bandink:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a2a;--grid:rgba(120,150,220,.1);--card:#222b40;--ink:#f1f4fb;--mut:#a3afc9;--pen:#9db7ff;--line:#38435e;--okbg:#1d6b48;--nobg:#7a2f39;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141a2a;--grid:rgba(120,150,220,.1);--card:#222b40;--ink:#f1f4fb;--mut:#a3afc9;--pen:#9db7ff;--line:#38435e;--okbg:#1d6b48;--nobg:#7a2f39;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px;background-attachment:fixed;color:var(--ink);font-family:"Gaegu","Noto Sans KR",system-ui,sans-serif;font-weight:700;font-size:21px;line-height:1.4;min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding:12px 16px 44px}
.track{position:relative;height:16px;background:var(--card);border:3px solid var(--ink);border-radius:10px;margin:30px 4px 30px}
.track i{display:block;height:100%;width:0;background:repeating-linear-gradient(-45deg,var(--band) 0 10px,var(--card) 10px 14px);border-radius:6px;transition:width .6s cubic-bezier(.3,1.4,.5,1)}
.track b{position:absolute;top:-28px;left:0;font-size:28px;transition:left .6s cubic-bezier(.3,1.4,.5,1);transform:translateX(-50%)}
.tagcard{position:relative;background:var(--card);border:3px solid var(--ink);border-radius:20px;box-shadow:0 9px 0 rgba(0,0,0,.2)}
.slot{position:absolute;top:-15px;left:50%;width:70px;height:18px;transform:translateX(-50%);background:var(--bg);border:3px solid var(--ink);border-radius:10px;z-index:2}
.hdr{position:relative;background:var(--band);color:var(--bandink);border-radius:16px 16px 0 0;text-align:center;padding:18px 10px 10px}
.hello{display:block;font:400 38px/1 "Permanent Marker",cursive;letter-spacing:3px}
.mni{display:block;font-size:17px;letter-spacing:2px;opacity:.95}
.cnt{position:absolute;right:12px;top:14px;background:rgba(255,255,255,.92);color:#222;border-radius:999px;padding:0 10px;font-size:16px}
.body{position:relative;padding:20px 18px 24px}
.sec{color:var(--mut);font-size:18px;margin-bottom:8px}
.q{font-size:30px;line-height:1.3;color:var(--pen);margin:0 0 16px}
.sent{font:700 29px/1.6 "Noto Sans KR",sans-serif;color:var(--pen);margin:0 0 8px;word-break:keep-all}
.blank{display:inline-block;min-width:50px;border-bottom:4px dashed var(--band);text-align:center;margin:0 2px}
.ru{color:var(--mut);font-size:19px;margin:0 0 16px}
.opts{display:grid;gap:12px;margin-top:8px}
.btn{font:700 22px "Noto Sans KR",sans-serif;min-height:60px;width:100%;padding:10px 16px;border-radius:14px;border:3px solid var(--ink);background:var(--card);color:var(--ink);cursor:pointer;box-shadow:0 5px 0 var(--ink);transition:transform .1s,box-shadow .1s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn:focus-visible,.inp:focus-visible,.chip:focus-visible,.tile:focus-visible{outline:4px solid var(--yel);outline-offset:2px}
.btn.main{background:var(--band);color:var(--bandink);margin-top:18px;font-family:"Gaegu",sans-serif;font-size:26px}
.btn.ghost{background:var(--yel);color:#222;margin-top:14px;font-family:"Gaegu",sans-serif;font-size:22px;min-height:54px}
.btn.ok,.chip.ok,.tile.ok{background:var(--okbg);color:var(--ink)}
.btn.no,.chip.no,.tile.no{background:var(--nobg);color:var(--ink)}
.btn:disabled,.chip:disabled{cursor:default;transform:none}
.inp{width:100%;min-height:62px;font:700 26px "Gaegu","Noto Sans KR",sans-serif;padding:6px 14px;border:0;border-bottom:4px solid var(--pen);background:transparent;color:var(--pen);text-align:center;border-radius:0}
.photo{background:var(--card);border:3px solid var(--ink);border-radius:8px;padding:10px 10px 8px;transform:rotate(-1.5deg);box-shadow:3px 5px 0 rgba(0,0,0,.2);text-align:center;margin:0 4px 18px}
.pic{background:var(--line);border-radius:4px;padding:14px 6px;font-size:50px;letter-spacing:8px;line-height:1.1}
.cap{font-size:20px;margin-top:6px}
.goal{font-size:21px;color:var(--pen);margin:0 0 12px;text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:12px}
.chip{font:700 26px "Noto Sans KR",sans-serif;min-height:58px;padding:6px 18px;border-radius:14px;border:3px solid var(--ink);background:var(--card);color:var(--ink);cursor:pointer;box-shadow:0 5px 0 var(--ink)}
.ans{min-height:72px;border-bottom:4px solid var(--pen);display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;padding:6px 0;margin-bottom:18px}
.ans:empty::before{content:"✎ нажимай на слова ниже";color:var(--mut);font-size:19px}
.pool{display:flex;flex-wrap:wrap;gap:10px}
.tile{font:700 23px "Noto Sans KR",sans-serif;min-height:54px;padding:6px 16px;border-radius:10px;border:3px solid var(--ink);background:var(--yel);color:#222;box-shadow:0 4px 0 var(--ink);cursor:pointer}
.tile.used{opacity:.25;pointer-events:none}
.lock{pointer-events:none}
.fb{margin-top:18px;padding:14px 16px;border-radius:14px;border:3px dashed var(--ink);animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
.fb.ok{background:var(--okbg)}.fb.no{background:var(--nobg)}
.fb b{font:700 24px "Noto Sans KR",sans-serif}
.fb p{margin:6px 0 0;font-size:19px}
.stamp{position:absolute;right:10px;top:82px;font:400 30px "Permanent Marker",cursive;color:#d62839;border:4px solid #d62839;border-radius:10px;padding:0 10px;background:rgba(255,255,255,.88);animation:stamp .6s cubic-bezier(.3,1.8,.5,1) forwards;pointer-events:none;z-index:3}
.sticker{position:absolute;font-size:38px;pointer-events:none;z-index:3}
.shake{animation:shake .4s}
.bounce{animation:bounce .6s}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:none;opacity:1}}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@keyframes bounce{30%{transform:scale(1.03) rotate(-1deg)}60%{transform:scale(.99) rotate(1deg)}}
@keyframes stamp{0%{transform:scale(3) rotate(-25deg);opacity:0}100%{transform:scale(1) rotate(-10deg);opacity:1}}
.petal{position:fixed;top:-40px;font-size:28px;pointer-events:none;z-index:9;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translate(var(--dx),108vh) rotate(var(--r));opacity:.3}}
.me{font-size:44px;text-align:center;color:var(--pen);border-bottom:4px solid var(--pen);margin:6px 0 14px;line-height:1.2;word-break:break-word}
.big{font:400 84px/1 "Permanent Marker",cursive;color:var(--band);text-align:center;margin:8px 0}
.center{text-align:center}
.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:2px dotted var(--mut);font-size:20px}
textarea{width:100%;height:120px;margin-top:12px;border:3px solid var(--ink);border-radius:12px;background:var(--card);color:var(--ink);font:13px/1.4 ui-monospace,monospace;padding:10px}
a.btn{display:block;text-align:center;text-decoration:none;line-height:36px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap"><div id="app"></div></div>
<script>
const TO="akosenko62@gmail.com";
/* c: [текст, верный, неверные[], пояснение, перевод]; p: [эмодзи, место, что сказать, текст, верный, неверные[], пояснение]
   b: [перевод, плитки[], лишние[], пояснение]; e: [части, номер ошибки, исправление, перевод, пояснение] */
const S=[
{t:"Часть 1 · Слова",ic:"🌍",col:["#e63946","#fff"],k:"c",q:[
["🇫🇷 Франция","프랑스",["독일","영국","미국"],"프랑스 — Франция."],
["🇯🇵 Япония","일본",["중국","한국","태국"],"일본 — Япония."],
["🇷🇺 Россия","러시아",["몽골","호주","캐나다"],"러시아 — Россия."],
["🩺 Врач","의사",["요리사","기자","가수"],"의사 — врач."],
["💼 Офисный работник","회사원",["군인","주부","학생"],"회사원 — сотрудник компании."],
["📰 Журналист","기자",["은행원","변호사","배우"],"기자 — журналист."],
["🤝 Приятно познакомиться","만나서 반갑습니다",["안녕히 가세요","안녕하세요?","안녕히 계세요"],"만나서 반갑습니다 — приятно познакомиться."],
["👋 Ты уходишь. Что скажешь тому, кто остаётся?","안녕히 계세요",["안녕히 가세요","안녕하세요?","만나서 반갑습니다"],"안녕히 계세요 — говорит уходящий; 안녕히 가세요 — говорит остающийся."]]},
{t:"Часть 2 · Грамматика",ic:"✍️",col:["#2f6fdb","#fff"],k:"c",q:[
["저___ 회사원이에요.","는",["은","이","가"],"저 — без патчима → 는.","Я офисный работник."],
["마이클___ 배우예요.","은",["는","이","가"],"마이클 заканчивается на ㄹ (патчим) → 은.","Майкл — актёр."],
["저는 학생___.","이에요",["예요","이","가"],"학생 — есть патчим → 이에요.","Я студент."],
["저는 요리사___.","예요",["이에요","이","가"],"요리사 — нет патчима → 예요.","Я повар."],
["지아는 의사___.","예요",["이에요","은","는"],"의사 — нет патчима → 예요.","Джиа — врач."],
["민수는 군인___.","이에요",["예요","은","는"],"군인 — есть патчим ㄴ → 이에요.","Минсу — военный."]]},
{t:"Часть 3 · Ситуации",ic:"🎬",col:["#1fa971","#fff"],k:"p",q:[
["🎤📺👔","Прямой эфир новостей. Ведущий представляется.","«Я журналист.»","저는 기자___.","입니다",["예요","입니까","가 아닙니다"],"Официальная обстановка (эфир, банк, армия, суд) → -ㅂ니다 / -ㅂ니까?"],
["☕🧋👫","Кафе. Ты знакомишься с новым другом.","«Я студент.»","저는 학생___.","이에요",["입니다","입니까","이 아닙니다"],"Дружеский, повседневный разговор → -이에요 / -예요."],
["🏦💳🤝","Банк. Клиент обращается к сотруднику.","«Вы банковский работник?»","은행원___?","입니까",["이에요","입니다","예요"],"Официально: вопрос → -ㅂ니까?"],
["🍕📱😆","Дома. Болтаешь с другом.","«Минсу — певец?»","민수는 가수___?","예요",["입니까","이에요","입니다"],"Дружеская беседа; 가수 без патчима → 예요."],
["🪖🫡🏕️","Воинская часть. Доклад командиру.","«Я военный.»","저는 군인___.","입니다",["이에요","입니까","이 아닙니다"],"Официально → -ㅂ니다."],
["🛋️🍵🏠","Вечер дома. Болтаешь с соседкой.","«Я домохозяйка.»","저는 주부___.","예요",["입니다","입니까","이에요"],"Дружеская беседа; 주부 без патчима → 예요."],
["⚖️🏛️👔","Зал суда.","«Я адвокат.»","저는 변호사___.","입니다",["예요","입니까","이에요"],"Официально → -ㅂ니다."],
["🍳🥘😊","Кухня. Говоришь с другом.","«Ты повар?»","요리사___?","예요",["입니까","이에요","입니다"],"Дружеская беседа; 요리사 без патчима → 예요."]]},
{t:"Часть 4 · Собери предложение",ic:"🧩",col:["#ffc233","#3a2a00"],k:"b",q:[
["Я учитель.",["저는","선생님","이에요"],["예요","은"],"선생님 — патчим → 이에요."],
["Минсу — врач.",["민수는","의사","예요"],["이에요","은"],"의사 — нет патчима → 예요."],
["Я повар. (официально)",["저는","요리사","입니다"],["이에요","입니까?"],"Официально: 입니다."],
["Джиа — студентка? (официально)",["지아는","학생","입니까?"],["입니다","이에요"],"Официальный вопрос: 입니까?"],
["Я не студент. (официально)",["저는","학생","이","아닙니다"],["가","입니다"],"학생 — патчим → 이 아닙니다."],
["Я не журналист. (официально)",["저는","기자","가","아닙니다"],["이","입니다"],"기자 — нет патчима → 가 아닙니다."]]},
{t:"Часть 5 · Найди ошибку",ic:"🔍",col:["#8a5cf6","#fff"],k:"e",q:[
[["저는","학생예요."],1,"학생이에요","Я студент.","학생 — есть патчим → 이에요."],
[["민수는","의사이에요."],1,"의사예요","Минсу — врач.","의사 — нет патчима → 예요."],
[["저은","기자예요."],0,"저는","Я журналист.","저 — нет патчима → 는."],
[["마이클는","배우예요."],0,"마이클은","Майкл — актёр.","마이클 — есть патчим ㄹ → 은."],
[["저는","기자입니까."],1,"기자입니다","Я журналист. (официально)","입니까 — вопрос; в утверждении нужно 입니다."],
[["저는","의사이","아닙니다."],1,"의사가","Я не врач. (официально)","의사 — нет патчима → 가 아닙니다."]]}
];
const $=s=>document.querySelector(s);
const total=S.reduce((a,x)=>a+x.q.length,0);
let si,qi,done,sc,log,name;
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const app=$("#app");
const setSec=i=>{const r=document.documentElement.style;r.setProperty("--band",S[i].col[0]);r.setProperty("--bandink",S[i].col[1])};
const sticker=(c,em,css)=>{const s=el("span","sticker",em);s.style.cssText=css;c.append(s)};
function tagcard(cnt){
  const c=el("div","tagcard");c.append(el("div","slot"));
  const h=el("div","hdr");h.append(el("span","hello","HELLO"),el("span","mni","my name is"));
  if(cnt)h.append(el("span","cnt",cnt));
  const b=el("div","body");c.append(h,b);return [c,b];
}

function start(){
  si=0;qi=0;done=0;sc=S.map(()=>0);log=[];setSec(0);
  app.innerHTML="";
  const [c,b]=tagcard();c.style.marginTop="26px";
  const i=el("input","inp");i.placeholder="твоё имя";i.autocomplete="name";
  try{i.value=localStorage.getItem("hw_name")||""}catch(e){}
  const bt=el("button","btn main","안녕하세요! · Начать");
  bt.onclick=()=>{name=i.value.trim();if(!name){i.focus();i.classList.add("shake");setTimeout(()=>i.classList.remove("shake"),400);return}
    try{localStorage.setItem("hw_name",name)}catch(e){}
    render()};
  b.append(i,bt);
  sticker(c,"🚌","right:-6px;top:-34px;transform:rotate(8deg)");
  sticker(c,"⭐","left:-10px;bottom:-20px;transform:rotate(-15deg)");
  app.append(c);
}

function render(){
  const sec=S[si],q=sec.q[qi];setSec(si);
  app.innerHTML="";
  const tr=el("div","track");const bi=el("i");const mk=el("b","","🚌");tr.append(bi,mk);app.append(tr);
  const setP=()=>{const p=done/total*100;bi.style.width=p+"%";mk.style.left=p+"%"};
  setP();
  const [c,b]=tagcard((qi+1)+" / "+sec.q.length);
  b.append(el("div","sec",sec.ic+" "+sec.t));
  const fb=el("div");
  const rec=(ok,user,right,expl)=>{
    done++;setP();
    if(ok){sc[si]++;petals();c.classList.add("bounce");c.append(el("span","stamp",["GREAT!","NICE!","COOL!","YES!"][Math.floor(Math.random()*4)]))}else{c.classList.add("shake")}
    log.push((si+1)+"."+(qi+1)+" "+(ok?"✓":"✗")+" "+user+(ok?"":" → "+right));
    fb.className="fb "+(ok?"ok":"no");fb.innerHTML="";
    fb.append(el("b","",ok?"정답! Верно!":"Правильно: "+right));
    if(expl)fb.append(el("p","",expl));
    const n=el("button","btn main",(si===S.length-1&&qi===sec.q.length-1)?"Результат 🎉":"다음 · Дальше");
    n.onclick=next;fb.append(n);n.focus({preventScroll:true});
  };
  const choice=(box,ans,wr,ex)=>{
    const o=el("div","opts");
    shuffle([ans,...wr]).forEach(w=>{const bt=el("button","btn",w);
      bt.onclick=()=>{o.querySelectorAll("button").forEach(x=>{x.disabled=true;if(x.textContent===ans)x.classList.add("ok")});
        if(w!==ans)bt.classList.add("no");
        rec(w===ans,w,ans,ex)};o.append(bt)});
    box.append(o);
  };
  const blank=s=>s.replace(/___/g,'<span class="blank">&nbsp;&nbsp;?&nbsp;&nbsp;</span>');
  if(sec.k==="c"){
    const [tx,ans,wr,ex,ru]=q;
    const p=el("p",/___/.test(tx)?"sent":"q");p.innerHTML=blank(tx);b.append(p);
    if(ru)b.append(el("p","ru",ru));
    choice(b,ans,wr,ex);
  }else if(sec.k==="p"){
    const [em,place,goal,tx,ans,wr,ex]=q;
    const ph=el("div","photo");ph.append(el("div","pic",em),el("div","cap","📍 "+place));b.append(ph);
    b.append(el("p","goal",goal));
    const p=el("p","sent");p.innerHTML=blank(tx);b.append(p);
    choice(b,ans,wr,ex);
  }else if(sec.k==="b"){
    const [ru,tiles,extra,ex]=q;
    b.append(el("p","q",ru));
    const all=shuffle([...tiles,...extra]);let picked=[],locked=false;
    const ans=el("div","ans"),pool=el("div","pool");
    const draw=()=>{ans.innerHTML="";pool.innerHTML="";
      picked.forEach(i=>{const t=el("button","tile",all[i]);t.onclick=()=>{picked=picked.filter(x=>x!==i);draw()};ans.append(t)});
      all.forEach((w,i)=>{const t=el("button","tile"+(picked.includes(i)?" used":""),w);t.onclick=()=>{picked.push(i);draw()};pool.append(t)})};
    draw();
    const bt=el("button","btn main","확인 · Проверить");
    bt.onclick=()=>{if(!picked.length)return;locked=true;bt.remove();ans.classList.add("lock");pool.classList.add("lock");
      const user=picked.map(i=>all[i]).join(" "),right=tiles.join(" "),ok=user===right;
      ans.querySelectorAll(".tile").forEach(t=>t.classList.add(ok?"ok":"no"));
      rec(ok,user,right,ex)};
    b.append(ans,pool,bt);
  }else{
    const [parts,w,fix,ru,ex]=q;
    b.append(el("p","ru",ru));
    const ch=el("div","chips");
    parts.forEach((t,idx)=>{const bt=el("button","chip",t);
      bt.onclick=()=>{ch.querySelectorAll("button").forEach(x=>x.disabled=true);
        ch.children[w].classList.add("ok");if(idx!==w)bt.classList.add("no");
        rec(idx===w,t,fix,"Исправление: "+parts[w]+" → "+fix+". "+ex)};
      ch.append(bt)});
    b.append(ch);
  }
  b.append(fb);
  sticker(c,["🌍","✍️","🎬","🧩","🔍"][si],"right:-8px;bottom:-24px;transform:rotate(14deg)");
  app.append(c);
}

function next(){qi++;if(qi>=S[si].q.length){si++;qi=0}
  if(si>=S.length)result();else{render();window.scrollTo({top:0,behavior:"smooth"})}}

function petals(){
  const E=["⭐","🎉","🗽","🍔","🚕","👏"];
  for(let k=0;k<16;k++){const p=el("span","petal",E[k%E.length]);
    p.style.left=(Math.random()*100)+"vw";
    p.style.setProperty("--dx",((Math.random()-.5)*180)+"px");
    p.style.setProperty("--r",(Math.random()*360)+"deg");
    p.style.animationDelay=(Math.random()*.4)+"s";
    document.body.append(p);setTimeout(()=>p.remove(),2400)}
}

function result(){
  const sum=sc.reduce((a,b)=>a+b,0),pct=Math.round(sum/total*100);
  app.innerHTML="";setSec(0);
  const tr=el("div","track");const bi=el("i");bi.style.width="100%";const mk=el("b","","🚌");mk.style.left="100%";tr.append(bi,mk);app.append(tr);
  const [c,b]=tagcard();
  b.append(el("div","me",name));
  b.append(el("div","big",pct+"%"));
  b.append(el("p","center",sum+" из "+total+" — "+(pct>=90?"대단해요! Отлично! 🏆":pct>=70?"잘했어요! Хорошая работа! 🌟":pct>=50?"좋아요! Неплохо, повтори слабые места.":"화이팅! Повтори тему и попробуй снова. 💪")));
  S.forEach((s,i)=>{const r=el("div","row");r.append(el("span","",s.ic+" "+s.t.split(" · ")[0]),el("b","",sc[i]+" / "+s.q.length));b.append(r)});
  const date=new Date().toLocaleString("ru-RU");
  const text="1과 (А0) — домашнее задание\nУченик: "+name+"\nДата: "+date+"\nИтого: "+sum+"/"+total+" ("+pct+"%)\n"+S.map((s,i)=>s.t.split(" · ")[0]+": "+sc[i]+"/"+s.q.length).join("; ")+"\n\nОтветы (✗ — ответ ученика → верный):\n"+log.join("\n");
  const a=el("a","btn main","📧 Отправить учителю");
  a.href="mailto:"+TO+"?subject="+encodeURIComponent("1과 ДЗ: "+name+" — "+sum+"/"+total)+"&body="+encodeURIComponent(text);
  a.target="_blank";a.rel="noopener";
  const ta=el("textarea");ta.value=text;ta.readOnly=true;
  const cp=el("button","btn ghost","Скопировать результат");
  cp.onclick=async()=>{try{await navigator.clipboard.writeText(text)}catch(e){ta.select();try{document.execCommand("copy")}catch(_){}}
    cp.textContent="Скопировано ✓"};
  const rs=el("button","btn ghost","다시 · Пройти заново");rs.onclick=start;
  b.append(a,cp,el("p","ru","Если почта не открылась, скопируй результат и отправь на "+TO),ta,rs);
  sticker(c,"🏆","right:-8px;top:-34px;transform:rotate(12deg)");
  app.append(c);
  petals();window.scrollTo({top:0});
}
start();
</script>
</body>
